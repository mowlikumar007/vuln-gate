name: container-security-gate

# Runs on every push / PR and can be triggered manually.
on:
  push:
  pull_request:
  workflow_dispatch:

# ------------------------------------------------------------------
# SEVERITY POLICY (single place to change it - see SECURITY_POLICY.md)
#   Fail the pipeline if the image contains any vulnerability whose
#   severity is in SEVERITY_THRESHOLD. Unfixed CVEs are ignored because
#   nothing can be done about them yet.
# ------------------------------------------------------------------
env:
  SEVERITY_THRESHOLD: "CRITICAL,HIGH"
  IGNORE_UNFIXED: "true"
  IMAGE_NAME: demo-app

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------
  # 1. Unit tests
  # ---------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r app/requirements.txt pytest
      - name: Run tests
        run: python -m pytest app -v

  # ---------------------------------------------------------------
  # 2. Build image -> Trivy report -> Severity gate
  # ---------------------------------------------------------------
  scan:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      dockerfile: ${{ steps.target.outputs.dockerfile }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Dockerfile (from BUILD_TARGET file)
        id: target
        run: |
          DF=$(tr -d '[:space:]' < BUILD_TARGET)
          test -f "$DF" || { echo "::error::BUILD_TARGET points to missing file: $DF"; exit 1; }
          echo "dockerfile=$DF" >> "$GITHUB_OUTPUT"
          echo "### Image under test: \`$DF\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build image
        run: |
          docker build \
            -f "${{ steps.target.outputs.dockerfile }}" \
            --build-arg GIT_SHA="${{ github.sha }}" \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # Always produce the FULL report (all severities) and never fail here,
      # so the evidence exists even when the gate below fails.
      - name: Generate full vulnerability report (table)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: vuln
          format: table
          output: trivy-report.txt
          exit-code: "0"

      - name: Generate machine-readable report (JSON)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: vuln
          format: json
          output: trivy-report.json
          exit-code: "0"

      - name: Show severity summary
        run: |
          {
            echo "## Vulnerability summary"
            echo '```'
            for s in CRITICAL HIGH MEDIUM LOW; do
              n=$(grep -o "\"Severity\": \"$s\"" trivy-report.json | wc -l)
              echo "$s: $n"
            done
            echo '```'
            echo "Policy: block $SEVERITY_THRESHOLD (ignore-unfixed=$IGNORE_UNFIXED)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports-${{ github.run_number }}
          path: |
            trivy-report.txt
            trivy-report.json

      # THE GATE: exit-code 1 fails the job when findings match the policy.
      - name: Severity gate (fails on policy violation)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: vuln
          severity: ${{ env.SEVERITY_THRESHOLD }}
          ignore-unfixed: ${{ env.IGNORE_UNFIXED }}
          format: table
          exit-code: "1"

  # ---------------------------------------------------------------
  # 3. Deploy - ONLY runs if test + scan (gate) passed
  # ---------------------------------------------------------------
  deploy:
    needs: scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_SERVER: ${{ secrets.SERVER_HOST != '' }}
      HAS_RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (same Dockerfile that passed the scan)
        run: |
          docker build \
            -f "${{ needs.scan.outputs.dockerfile }}" \
            --build-arg GIT_SHA="${{ github.sha }}" \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to server over SSH
        if: env.HAS_SERVER == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "${{ env.IMAGE }}:${{ github.sha }}"
            docker rm -f vuln-gate-app 2>/dev/null || true
            docker run -d --name vuln-gate-app --restart unless-stopped -p 80:5000 "${{ env.IMAGE }}:${{ github.sha }}"
            sleep 5
            curl -fsS http://localhost/health

      - name: Skipped deploy notice
        if: env.HAS_SERVER != 'true'
        run: echo "::warning::SERVER_HOST secret not set - image pushed to GHCR but not deployed to a server."
